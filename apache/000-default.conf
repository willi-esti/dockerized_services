Listen 444
Listen 445

<VirtualHost *:80>
    ServerAdmin ${SERVER_ADMIN}
    DocumentRoot /var/www/html
    Redirect permanent / https://${SERVER_DOMAIN}:443/
</VirtualHost>

<VirtualHost *:80>
    ServerName ${WIKI_DOMAIN}
    Redirect permanent / https://${SERVER_DOMAIN}:444/
</VirtualHost>

<VirtualHost *:80>
    ServerName ${PLANKA_DOMAIN}
    Redirect permanent / https://${SERVER_DOMAIN}:445/
</VirtualHost>

<VirtualHost *:443>
    ServerName ${SERVER_DOMAIN}
    ServerAdmin ${SERVER_ADMIN}
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile ${SSL_CERTIFICATE_FILE}
    SSLCertificateKeyFile ${SSL_CERTIFICATE_KEY_FILE}

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# SSL VirtualHost for Wiki.js on port 444
<VirtualHost *:444>
    ServerName ${SERVER_DOMAIN}
    SSLEngine on
    SSLCertificateFile ${SSL_CERTIFICATE_FILE}
    SSLCertificateKeyFile ${SSL_CERTIFICATE_KEY_FILE}

    ErrorLog ${APACHE_LOG_DIR}/wiki_error.log
    CustomLog ${APACHE_LOG_DIR}/wiki_access.log combined

    SSLProxyEngine on
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://wiki:3000/
    ProxyPassReverse / http://wiki:3000/
</VirtualHost>

# SSL VirtualHost for Planka on port 445
<VirtualHost *:445>
    ServerName ${SERVER_DOMAIN}
    SSLEngine on
    SSLCertificateFile ${SSL_CERTIFICATE_FILE}
    SSLCertificateKeyFile ${SSL_CERTIFICATE_KEY_FILE}

    ErrorLog ${APACHE_LOG_DIR}/planka_error.log
    CustomLog ${APACHE_LOG_DIR}/planka_access.log combined

    SSLProxyEngine on
    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/(.*) ws://planka:1337/$1 [P,L]

    ProxyPass / http://planka:1337/
    ProxyPassReverse / http://planka:1337/
</VirtualHost>

# Enable SSL module
LoadModule ssl_module modules/mod_ssl.so
