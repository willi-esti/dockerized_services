<VirtualHost *:80>
    ServerAdmin ${SERVER_ADMIN}
    DocumentRoot /var/www/html
    Redirect permanent / https://${SERVER_DOMAIN}
    # Redirect specific paths to HTTPS with same prefix
    Redirect permanent /ergo https://${SERVER_DOMAIN}/ergo
    Redirect permanent /doxero https://${SERVER_DOMAIN}/doxero
</VirtualHost>

<VirtualHost *:443>
    ServerName ${SERVER_DOMAIN}
    ServerAdmin ${SERVER_ADMIN}
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile ${SSL_CERTIFICATE_FILE}
    SSLCertificateKeyFile ${SSL_CERTIFICATE_KEY_FILE}

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    # Enable proxying and preserve host header
    SSLProxyEngine on
    ProxyPreserveHost On
    ProxyRequests Off

    # Proxy Planka at /ergo with WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ergo/socket.io/(.*) ws://172.20.0.2:1337/socket.io/$1 [P,L]
    ProxyPass /ergo http://172.20.0.2:1337/
    ProxyPassReverse /ergo http://172.20.0.2:1337/

    # Proxy Wiki.js at /doxero
    ProxyPass /doxero http://172.20.0.3:3000/
    ProxyPassReverse /doxero http://172.20.0.3:3000/
</VirtualHost>

# Enable SSL module
LoadModule ssl_module modules/mod_ssl.so
